name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adet
          POSTGRES_PASSWORD: adet
          POSTGRES_DB: adet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adet" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://adet:adet@localhost:5432/adet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests d'intégration
        run: pnpm test
      # Base vierge, comme lors d'un vrai déploiement (la base de test, créée en mode
      # développement, déclencherait une question interactive de Payload lors des migrations)
      - name: Base de build vierge
        run: PGPASSWORD=adet psql -h localhost -U adet -d adet_test -c 'CREATE DATABASE adet_build'
      - name: Build de production (migrations + pages)
        run: pnpm build:prod
        env:
          DATABASE_URL: postgres://adet:adet@localhost:5432/adet_build
          PAYLOAD_SECRET: secret-ci
          NEXT_PUBLIC_SITE_URL: https://adet.example

  # Construit l'image Docker de production (impossible dans la session cloud, sans moteur Docker)
  image-docker:
    runs-on: ubuntu-latest
    needs: verifier
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adet
          POSTGRES_PASSWORD: adet
          POSTGRES_DB: adet_image
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adet" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: |
          set -o pipefail
          docker build --progress=plain --network host -t adet-plateforme:ci \
            --build-arg DATABASE_URL=postgres://adet:adet@127.0.0.1:5432/adet_image \
            --build-arg PAYLOAD_SECRET=secret-ci \
            --build-arg NEXT_PUBLIC_SITE_URL=https://adet.example \
            app 2>&1 | tee docker-build.log
      - name: Signaler l'erreur de build
        if: failure()
        run: |
          grep -iE "error|ERR_|failed" docker-build.log | tail -15 | while IFS= read -r ligne; do echo "::error::$ligne"; done
      - name: Démarrer le conteneur et vérifier /api/sante
        run: |
          docker run -d --name adet --network host \
            -e DATABASE_URL=postgres://adet:adet@127.0.0.1:5432/adet_image \
            -e PAYLOAD_SECRET=secret-ci -e NEXT_PUBLIC_SITE_URL=https://adet.example adet-plateforme:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/sante; then echo; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "page /fr : %{http_code}\n" http://127.0.0.1:3000/fr
          docker logs adet | tail -20
